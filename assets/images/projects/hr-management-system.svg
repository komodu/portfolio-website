<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="hr-title hr-desc">
  <title id="hr-title">HR Management System interface concept</title>
  <desc id="hr-desc">Illustrative mockup of an HR dashboard with employee stats, a directory table, and a department breakdown.</desc>
  <defs>
    <linearGradient id="hrBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf3e2"/>
      <stop offset="100%" stop-color="#f2e6c8"/>
    </linearGradient>
    <linearGradient id="hrSidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1810"/>
      <stop offset="100%" stop-color="#2a2418"/>
    </linearGradient>
    <filter id="hrShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b1810" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#hrBg)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="1200" height="46" fill="#efe4c8"/>
  <circle cx="28" cy="23" r="7" fill="#e2846f"/>
  <circle cx="52" cy="23" r="7" fill="#e0b45a"/>
  <circle cx="76" cy="23" r="7" fill="#7fb88f"/>
  <rect x="500" y="12" width="200" height="22" rx="11" fill="#ffffff" opacity="0.7"/>

  <!-- sidebar -->
  <rect x="0" y="46" width="220" height="704" fill="url(#hrSidebar)"/>
  <rect x="28" y="82" width="24" height="24" rx="6" fill="#c9962f"/>
  <rect x="64" y="88" width="110" height="14" rx="4" fill="#f2ede2" opacity="0.9"/>
  <g fill="#f2ede2" opacity="0.55">
    <rect x="28" y="160" width="164" height="14" rx="4" opacity="0.9" fill="#c9962f"/>
    <rect x="28" y="206" width="130" height="14" rx="4"/>
    <rect x="28" y="252" width="150" height="14" rx="4"/>
    <rect x="28" y="298" width="110" height="14" rx="4"/>
    <rect x="28" y="344" width="140" height="14" rx="4"/>
  </g>
  <rect x="28" y="152" width="164" height="32" rx="8" fill="#c9962f" opacity="0.16"/>

  <!-- top bar -->
  <rect x="220" y="46" width="980" height="86" fill="#fffdf7"/>
  <rect x="256" y="76" width="260" height="24" rx="6" fill="#1b1810"/>
  <circle cx="1160" cy="89" r="20" fill="#c9962f" opacity="0.3"/>
  <rect x="1024" y="76" width="112" height="26" rx="13" fill="#1b1810" opacity="0.06"/>

  <!-- stat cards -->
  <g filter="url(#hrShadow)">
    <rect x="256" y="150" width="210" height="72" rx="14" fill="#ffffff"/>
    <rect x="486" y="150" width="210" height="72" rx="14" fill="#ffffff"/>
    <rect x="716" y="150" width="210" height="72" rx="14" fill="#ffffff"/>
    <rect x="946" y="150" width="210" height="72" rx="14" fill="#ffffff"/>
  </g>
  <g fill="#1b1810">
    <text x="278" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">Total Employees</text>
    <text x="278" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="700">312</text>
    <text x="508" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">On Leave</text>
    <text x="508" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="700">14</text>
    <text x="738" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">Open Roles</text>
    <text x="738" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="700">9</text>
    <text x="968" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">Departments</text>
    <text x="968" y="205" font-family="Arial, sans-serif" font-size="20" font-weight="700">8</text>
  </g>

  <!-- employee directory table -->
  <g filter="url(#hrShadow)">
    <rect x="256" y="248" width="618" height="322" rx="14" fill="#ffffff"/>
  </g>
  <text x="280" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1810" opacity="0.75">EMPLOYEE DIRECTORY</text>
  <rect x="700" y="264" width="150" height="26" rx="13" fill="#c9962f" opacity="0.15"/>
  <text x="722" y="281" font-family="Arial, sans-serif" font-size="10" font-weight="700" fill="#a97a1f">+ ADD EMPLOYEE</text>

  <g id="hr-rows">
    <!-- header -->
    <rect x="280" y="304" width="570" height="1" fill="#1b1810" opacity="0.08"/>
    <text x="280" y="300" font-family="Arial, sans-serif" font-size="10" fill="#1b1810" opacity="0.4">NAME</text>
    <text x="520" y="300" font-family="Arial, sans-serif" font-size="10" fill="#1b1810" opacity="0.4">DEPARTMENT</text>
    <text x="680" y="300" font-family="Arial, sans-serif" font-size="10" fill="#1b1810" opacity="0.4">STATUS</text>
  </g>

  <g>
    <circle cx="296" cy="332" r="14" fill="#e2846f" opacity="0.35"/>
    <rect x="320" y="326" width="120" height="9" rx="4" fill="#1b1810" opacity="0.7"/>
    <rect x="320" y="339" width="80" height="7" rx="3" fill="#1b1810" opacity="0.3"/>
    <rect x="520" y="328" width="90" height="9" rx="4" fill="#1b1810" opacity="0.45"/>
    <rect x="680" y="324" width="66" height="18" rx="9" fill="#7fb88f" opacity="0.25"/>
    <text x="692" y="337" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#3f7a52">ACTIVE</text>
  </g>
  <g>
    <circle cx="296" cy="378" r="14" fill="#c9962f" opacity="0.35"/>
    <rect x="320" y="372" width="130" height="9" rx="4" fill="#1b1810" opacity="0.7"/>
    <rect x="320" y="385" width="70" height="7" rx="3" fill="#1b1810" opacity="0.3"/>
    <rect x="520" y="374" width="100" height="9" rx="4" fill="#1b1810" opacity="0.45"/>
    <rect x="680" y="370" width="66" height="18" rx="9" fill="#7fb88f" opacity="0.25"/>
    <text x="692" y="383" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#3f7a52">ACTIVE</text>
  </g>
  <g>
    <circle cx="296" cy="424" r="14" fill="#7fb88f" opacity="0.35"/>
    <rect x="320" y="418" width="110" height="9" rx="4" fill="#1b1810" opacity="0.7"/>
    <rect x="320" y="431" width="90" height="7" rx="3" fill="#1b1810" opacity="0.3"/>
    <rect x="520" y="420" width="95" height="9" rx="4" fill="#1b1810" opacity="0.45"/>
    <rect x="680" y="416" width="66" height="18" rx="9" fill="#e0b45a" opacity="0.3"/>
    <text x="691" y="429" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#a97a1f">ON LEAVE</text>
  </g>
  <g>
    <circle cx="296" cy="470" r="14" fill="#e2846f" opacity="0.25"/>
    <rect x="320" y="464" width="140" height="9" rx="4" fill="#1b1810" opacity="0.7"/>
    <rect x="320" y="477" width="75" height="7" rx="3" fill="#1b1810" opacity="0.3"/>
    <rect x="520" y="466" width="85" height="9" rx="4" fill="#1b1810" opacity="0.45"/>
    <rect x="680" y="462" width="66" height="18" rx="9" fill="#7fb88f" opacity="0.25"/>
    <text x="692" y="475" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#3f7a52">ACTIVE</text>
  </g>
  <g>
    <circle cx="296" cy="516" r="14" fill="#c9962f" opacity="0.25"/>
    <rect x="320" y="510" width="115" height="9" rx="4" fill="#1b1810" opacity="0.7"/>
    <rect x="320" y="523" width="85" height="7" rx="3" fill="#1b1810" opacity="0.3"/>
    <rect x="520" y="512" width="90" height="9" rx="4" fill="#1b1810" opacity="0.45"/>
    <rect x="680" y="508" width="66" height="18" rx="9" fill="#7fb88f" opacity="0.25"/>
    <text x="692" y="521" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#3f7a52">ACTIVE</text>
  </g>

  <!-- department breakdown panel -->
  <g filter="url(#hrShadow)">
    <rect x="898" y="248" width="270" height="322" rx="14" fill="#ffffff"/>
  </g>
  <text x="922" y="280" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1810" opacity="0.75">DEPARTMENTS</text>

  <circle cx="990" cy="360" r="58" fill="none" stroke="#f0e4c4" stroke-width="16"/>
  <circle cx="990" cy="360" r="58" fill="none" stroke="#c9962f" stroke-width="16" stroke-dasharray="180 365" stroke-linecap="round" transform="rotate(-90 990 360)"/>
  <circle cx="990" cy="360" r="58" fill="none" stroke="#7fb88f" stroke-width="16" stroke-dasharray="90 365" stroke-dashoffset="-180" stroke-linecap="round" transform="rotate(-90 990 360)"/>
  <circle cx="990" cy="360" r="58" fill="none" stroke="#e2846f" stroke-width="16" stroke-dasharray="60 365" stroke-dashoffset="-270" stroke-linecap="round" transform="rotate(-90 990 360)"/>
  <text x="990" y="356" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#1b1810">8</text>
  <text x="990" y="374" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#1b1810" opacity="0.5">teams</text>

  <g font-family="Arial, sans-serif" font-size="11" fill="#1b1810">
    <circle cx="928" cy="452" r="5" fill="#c9962f"/>
    <text x="942" y="456" opacity="0.75">Engineering — 96</text>
    <circle cx="928" cy="478" r="5" fill="#7fb88f"/>
    <text x="942" y="482" opacity="0.75">Operations — 64</text>
    <circle cx="928" cy="504" r="5" fill="#e2846f"/>
    <text x="942" y="508" opacity="0.75">Sales — 48</text>
    <circle cx="928" cy="530" r="5" fill="#1b1810" opacity="0.3"/>
    <text x="942" y="534" opacity="0.75">Other — 104</text>
  </g>

  <rect x="922" y="552" width="222" height="1" fill="#1b1810" opacity="0.08"/>
</svg>
