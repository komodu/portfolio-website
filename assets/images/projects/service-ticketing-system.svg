<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="svc-title svc-desc">
  <title id="svc-title">Service Ticketing System interface concept</title>
  <desc id="svc-desc">Illustrative mockup of a ticket board with Open, In Progress, and Resolved columns.</desc>
  <defs>
    <linearGradient id="svcBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbf3e2"/>
      <stop offset="100%" stop-color="#f2e6c8"/>
    </linearGradient>
    <linearGradient id="svcSidebar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1810"/>
      <stop offset="100%" stop-color="#2a2418"/>
    </linearGradient>
    <filter id="svcShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#1b1810" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="750" fill="url(#svcBg)"/>

  <!-- browser chrome -->
  <rect x="0" y="0" width="1200" height="46" fill="#efe4c8"/>
  <circle cx="28" cy="23" r="7" fill="#e2846f"/>
  <circle cx="52" cy="23" r="7" fill="#e0b45a"/>
  <circle cx="76" cy="23" r="7" fill="#7fb88f"/>
  <rect x="500" y="12" width="200" height="22" rx="11" fill="#ffffff" opacity="0.7"/>

  <!-- sidebar -->
  <rect x="0" y="46" width="220" height="704" fill="url(#svcSidebar)"/>
  <circle cx="42" cy="90" r="12" fill="#c9962f"/>
  <rect x="64" y="82" width="110" height="16" rx="4" fill="#f2ede2" opacity="0.9"/>
  <g fill="#f2ede2" opacity="0.55">
    <rect x="28" y="150" width="164" height="14" rx="4"/>
    <rect x="28" y="196" width="164" height="14" rx="4" opacity="0.9" fill="#c9962f"/>
    <rect x="28" y="242" width="120" height="14" rx="4"/>
    <rect x="28" y="288" width="140" height="14" rx="4"/>
    <rect x="28" y="334" width="100" height="14" rx="4"/>
  </g>
  <rect x="28" y="188" width="164" height="32" rx="8" fill="#c9962f" opacity="0.16"/>

  <!-- top bar -->
  <rect x="220" y="46" width="980" height="86" fill="#fffdf7"/>
  <rect x="256" y="76" width="230" height="24" rx="6" fill="#1b1810"/>
  <rect x="1006" y="72" width="150" height="34" rx="17" fill="#c9962f"/>
  <rect x="1030" y="83" width="102" height="12" rx="4" fill="#1b1810" opacity="0.85"/>

  <!-- stat row -->
  <g filter="url(#svcShadow)">
    <rect x="256" y="150" width="210" height="70" rx="14" fill="#ffffff"/>
    <rect x="486" y="150" width="210" height="70" rx="14" fill="#ffffff"/>
    <rect x="716" y="150" width="210" height="70" rx="14" fill="#ffffff"/>
    <rect x="946" y="150" width="210" height="70" rx="14" fill="#ffffff"/>
  </g>
  <g fill="#1b1810">
    <text x="278" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">Open Tickets</text>
    <text x="278" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700">128</text>
    <text x="508" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">In Progress</text>
    <text x="508" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700">42</text>
    <text x="738" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">Resolved Today</text>
    <text x="738" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700">67</text>
    <text x="968" y="180" font-family="Arial, sans-serif" font-size="12" opacity="0.5">Avg. Response</text>
    <text x="968" y="204" font-family="Arial, sans-serif" font-size="20" font-weight="700">18m</text>
  </g>

  <!-- kanban columns -->
  <!-- Open -->
  <text x="256" y="256" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1810" opacity="0.7">OPEN</text>
  <g filter="url(#svcShadow)">
    <rect x="256" y="270" width="230" height="92" rx="12" fill="#ffffff"/>
    <rect x="256" y="374" width="230" height="92" rx="12" fill="#ffffff"/>
    <rect x="256" y="478" width="230" height="92" rx="12" fill="#ffffff"/>
  </g>
  <g>
    <rect x="276" y="288" width="54" height="16" rx="8" fill="#e2846f" opacity="0.2"/>
    <text x="284" y="300" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#c05a45">URGENT</text>
    <rect x="276" y="316" width="180" height="10" rx="3" fill="#1b1810" opacity="0.75"/>
    <rect x="276" y="332" width="130" height="8" rx="3" fill="#1b1810" opacity="0.35"/>
    <circle cx="286" cy="352" r="8" fill="#c9962f" opacity="0.7"/>

    <rect x="276" y="392" width="54" height="16" rx="8" fill="#7fb88f" opacity="0.25"/>
    <text x="284" y="404" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#3f7a52">LOW</text>
    <rect x="276" y="420" width="170" height="10" rx="3" fill="#1b1810" opacity="0.75"/>
    <rect x="276" y="436" width="120" height="8" rx="3" fill="#1b1810" opacity="0.35"/>
    <circle cx="286" cy="456" r="8" fill="#c9962f" opacity="0.5"/>

    <rect x="276" y="496" width="54" height="16" rx="8" fill="#e0b45a" opacity="0.25"/>
    <text x="284" y="508" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#a97a1f">MEDIUM</text>
    <rect x="276" y="524" width="185" height="10" rx="3" fill="#1b1810" opacity="0.75"/>
    <rect x="276" y="540" width="110" height="8" rx="3" fill="#1b1810" opacity="0.35"/>
    <circle cx="286" cy="560" r="8" fill="#c9962f" opacity="0.6"/>
  </g>

  <!-- In progress -->
  <text x="510" y="256" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1810" opacity="0.7">IN PROGRESS</text>
  <g filter="url(#svcShadow)">
    <rect x="510" y="270" width="230" height="92" rx="12" fill="#ffffff"/>
    <rect x="510" y="374" width="230" height="92" rx="12" fill="#ffffff"/>
  </g>
  <g>
    <rect x="530" y="288" width="60" height="16" rx="8" fill="#c9962f" opacity="0.2"/>
    <text x="538" y="300" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#a97a1f">ASSIGNED</text>
    <rect x="530" y="316" width="175" height="10" rx="3" fill="#1b1810" opacity="0.75"/>
    <rect x="530" y="332" width="120" height="8" rx="3" fill="#1b1810" opacity="0.35"/>
    <rect x="530" y="348" width="140" height="6" rx="3" fill="#c9962f" opacity="0.3"/>
    <rect x="530" y="348" width="80" height="6" rx="3" fill="#c9962f"/>

    <rect x="530" y="392" width="60" height="16" rx="8" fill="#c9962f" opacity="0.2"/>
    <text x="538" y="404" font-family="Arial, sans-serif" font-size="9" font-weight="700" fill="#a97a1f">ASSIGNED</text>
    <rect x="530" y="420" width="165" height="10" rx="3" fill="#1b1810" opacity="0.75"/>
    <rect x="530" y="436" width="110" height="8" rx="3" fill="#1b1810" opacity="0.35"/>
    <rect x="530" y="452" width="140" height="6" rx="3" fill="#c9962f" opacity="0.3"/>
    <rect x="530" y="452" width="45" height="6" rx="3" fill="#c9962f"/>
  </g>

  <!-- Resolved -->
  <text x="764" y="256" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#1b1810" opacity="0.7">RESOLVED</text>
  <g filter="url(#svcShadow)">
    <rect x="764" y="270" width="230" height="92" rx="12" fill="#ffffff"/>
    <rect x="764" y="374" width="230" height="92" rx="12" fill="#ffffff"/>
    <rect x="764" y="478" width="230" height="92" rx="12" fill="#ffffff"/>
  </g>
  <g>
    <path d="M786 296l6 6 12-12" stroke="#3f7a52" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="784" y="316" width="170" height="10" rx="3" fill="#1b1810" opacity="0.6"/>
    <rect x="784" y="332" width="130" height="8" rx="3" fill="#1b1810" opacity="0.3"/>

    <path d="M786 400l6 6 12-12" stroke="#3f7a52" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="784" y="420" width="180" height="10" rx="3" fill="#1b1810" opacity="0.6"/>
    <rect x="784" y="436" width="120" height="8" rx="3" fill="#1b1810" opacity="0.3"/>

    <path d="M786 504l6 6 12-12" stroke="#3f7a52" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="784" y="524" width="160" height="10" rx="3" fill="#1b1810" opacity="0.6"/>
    <rect x="784" y="540" width="100" height="8" rx="3" fill="#1b1810" opacity="0.3"/>
  </g>

  <!-- activity / assignment panel -->
  <g filter="url(#svcShadow)">
    <rect x="1018" y="270" width="150" height="300" rx="14" fill="#ffffff"/>
  </g>
  <text x="1038" y="298" font-family="Arial, sans-serif" font-size="12" font-weight="700" fill="#1b1810" opacity="0.7">TEAM LOAD</text>
  <g>
    <circle cx="1050" cy="326" r="14" fill="#c9962f" opacity="0.35"/>
    <rect x="1074" y="320" width="76" height="8" rx="4" fill="#1b1810" opacity="0.6"/>
    <rect x="1074" y="332" width="60" height="6" rx="3" fill="#1b1810" opacity="0.3"/>

    <circle cx="1050" cy="374" r="14" fill="#7fb88f" opacity="0.35"/>
    <rect x="1074" y="368" width="76" height="8" rx="4" fill="#1b1810" opacity="0.6"/>
    <rect x="1074" y="380" width="46" height="6" rx="3" fill="#1b1810" opacity="0.3"/>

    <circle cx="1050" cy="422" r="14" fill="#e2846f" opacity="0.35"/>
    <rect x="1074" y="416" width="76" height="8" rx="4" fill="#1b1810" opacity="0.6"/>
    <rect x="1074" y="428" width="55" height="6" rx="3" fill="#1b1810" opacity="0.3"/>

    <rect x="1038" y="466" width="112" height="1" fill="#1b1810" opacity="0.1"/>
    <text x="1038" y="494" font-family="Arial, sans-serif" font-size="11" fill="#1b1810" opacity="0.5">SLA compliance</text>
    <rect x="1038" y="504" width="112" height="10" rx="5" fill="#1b1810" opacity="0.08"/>
    <rect x="1038" y="504" width="92" height="10" rx="5" fill="#c9962f"/>
    <text x="1038" y="534" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#1b1810">92%</text>
  </g>
</svg>
